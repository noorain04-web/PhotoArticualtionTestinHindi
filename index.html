<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">

    <title>PGIMER Articulation Assessment - Report Ready</title>
    <!-- jsPDF & jsPDF-AutoTable for Client-Side PDF Generation -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>
    <style>
        :root { 
            --primary: #0284c7; 
            --bg: #f8fafc; 
            --text: #0f172a; 
            --target-accent: #f59e0b;
            --highlight-color: #dc2626;
        }
        body { font-family: system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 10px; display: flex; flex-direction: column; align-items: center; }
        .container { width: 100%; max-width: 460px; background: #fff; padding: 20px; border-radius: 24px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); box-sizing: border-box; }
        
        .session-info { font-size: 0.75rem; color: #64748b; background: #f1f5f9; padding: 10px; border-radius: 12px; margin-bottom: 12px; width: 100%; text-align: center; border: 1px solid #e2e8f0; display: none; }
        
        .registration-box { background: #f1f5f9; padding: 15px; border-radius: 18px; margin-bottom: 15px; border: 2px solid var(--primary); }
        .meta-input { width: 100%; padding: 10px; margin: 5px 0; border: 1px solid #cbd5e1; border-radius: 8px; box-sizing: border-box; font-size: 0.95rem; }
        
        .stimulus-box { width: 100%; height: 290px; background: #f8fafc; border-radius: 18px; display: flex; flex-direction: column; align-items: center; justify-content: center; margin-bottom: 15px; border: 1px dashed #cbd5e1; overflow: hidden; position: relative; }
        .stimulus-image { max-width: 85%; max-height: 58%; object-fit: contain; }
        
        .target-word { font-size: 2.3rem; font-weight: 800; margin-top: 6px; color: var(--text); }
        .header-card { font-size: 2.4rem; font-weight: 900; color: #ef4444; }
        
        .highlight-target {
            color: var(--highlight-color) !important;
            font-weight: 900;
            text-decoration: underline;
            text-underline-offset: 4px;
        }
        
        .target-sound-badge {
            background: var(--target-accent);
            color: #fff;
            padding: 4px 14px;
            border-radius: 20px;
            font-size: 0.95rem;
            font-weight: 700;
            margin-bottom: 8px;
            display: none;
            box-shadow: 0 2px 8px rgba(245, 158, 11, 0.25);
        }
        
        .btn-record { background: #ef4444; color: white; width: 100%; padding: 13px; border-radius: 14px; border: none; font-weight: 700; cursor: pointer; font-size: 0.95rem; }
        .recording { background: #991b1b !important; animation: pulse 1.5s infinite; }
        .review-panel { background: #f0fdf4; border: 2px solid #10b981; padding: 15px; border-radius: 18px; display: none; margin-top: 15px; }
        .soda-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin: 10px 0; }
        .soda-btn { background: white; border: 1px solid #cbd5e1; padding: 9px; border-radius: 8px; font-size: 0.85rem; text-align: center; cursor: pointer; font-weight: 600; }
        .soda-btn.selected { background: var(--primary); color: white; border-color: var(--primary); }
        
        .btn-pdf { background: #0f172a; color: white; width: 100%; padding: 12px; border-radius: 14px; border: none; font-weight: 700; cursor: pointer; font-size: 0.9rem; margin-top: 12px; }
        
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.7; } }
    </style>
</head>
<body>

<div class="container">
    <div id="sessionDisplay" class="session-info"></div>

    <div style="text-align:center; font-size:0.75rem; font-weight:bold; color:#64748b; margin-bottom:10px;" id="counter">ITEM 1 / 108</div>

    <div class="stimulus-box" id="mainDisplay">
        <div id="regForm" class="registration-box">
            <span style="font-size: 0.8rem; font-weight: 800; color: var(--primary);">PATIENT REGISTRATION</span>
            <input type="text" id="pName" class="meta-input" placeholder="Patient Name (Mandatory)">
            <div style="display:flex; gap:10px;">
                <input type="text" id="pAge" class="meta-input" placeholder="Age">
                <select id="pGender" class="meta-input"><option value="Male">Male</option><option value="Female">Female</option><option value="Other">Other</option></select>
            </div>
            <input type="text" id="pCR" class="meta-input" placeholder="CR / Patient ID (Optional)">
            <input type="text" id="pClinician" class="meta-input" placeholder="Clinician / Examiner Name">
        </div>
        
        <div id="targetSoundBadge" class="target-sound-badge"></div>
        <img id="displayImg" src="" class="stimulus-image" style="display:none;" alt="Stimulus">
        <div id="displayText" class="target-word"></div>
    </div>

    <div style="display:flex; gap:10px; width:100%; margin-bottom:12px;">
        <button class="soda-btn" style="flex:1" onclick="changeItem(-1)">PREV</button>
        <button class="soda-btn" style="flex:1" onclick="changeItem(1)">NEXT</button>
    </div>

    <button id="recordBtn" class="btn-record" style="display:none;" onclick="handleRecording()">🎙️ RECORD SAMPLE</button>

    <div id="reviewPanel" class="review-panel">
        <button class="soda-btn" style="width:100%; background:#0f172a; color:white; margin-bottom:10px;" onclick="playCurrent()">▶️ PREVIEW AUDIO</button>
        <div class="soda-grid">
            <div class="soda-btn" onclick="setLabel('Normal', this)">Normal</div>
            <div class="soda-btn" onclick="setLabel('Substitution', this)">Substitution</div>
            <div class="soda-btn" onclick="setLabel('Omission', this)">Omission</div>
            <div class="soda-btn" onclick="setLabel('Distortion', this)">Distortion</div>
            <div class="soda-btn" onclick="setLabel('Addition', this)">Addition</div>
        </div>
        <button class="btn-record" style="background:#10b981; margin:0;" onclick="finalizeSave()">💾 SAVE SAMPLE</button>
    </div>

    <!-- Download PDF Report Button -->
    <button class="btn-pdf" onclick="generatePDFReport()">📄 DOWNLOAD SODA REPORT (PDF)</button>
</div>

        { word: "य<span class='highlight-target'>ज्ञ</span>", img: "yagya.jpg", rawWord: "यज्ञ", targetKey: "ज्ञ (Conjunct Final)" }
    ];

    // Response Tracking State indexed by item position
    let clinicianResults = {};

    let currentIdx = 0, mediaRecorder, chunks = [], currentBlob = null, currentLabel = "NotLabeled";
    let audioCtx, streamSource, biquadFilter;

    function checkMetadata() {
        const name = document.getElementById('pName').value.trim();
        const age = document.getElementById('pAge').value.trim();
        const gender = document.getElementById('pGender').value;
        const display = document.getElementById('sessionDisplay');

        if (name !== "") {
            display.style.display = "block";
            display.textContent = `ACTIVE SESSION: ${name} (${age || 'N/A'}, ${gender})`;
            return true;
        }
        return false;
    }

    function changeItem(step) {
        if (step > 0 && currentIdx === 0 && !checkMetadata()) {
            alert("Mandatory: Please enter Patient Name to begin.");
            return;
        }
        currentIdx = (currentIdx + step + assessmentList.length) % assessmentList.length;
        updateUI();
    }

    function updateUI() {
        const item = assessmentList[currentIdx];
        const dImg = document.getElementById('displayImg');
        const dTxt = document.getElementById('displayText');
        const rBtn = document.getElementById('recordBtn');
        const reg = document.getElementById('regForm');
        const badge = document.getElementById('targetSoundBadge');
        
        if (currentIdx === 0 || item.type === "header") {
            reg.style.display = currentIdx === 0 ? "block" : "none";
            dImg.style.display = "none";
            badge.style.display = "none";
            dTxt.innerHTML = `<span class="header-card">${item.word}</span>`;
            rBtn.style.display = "none";
        } else {
            reg.style.display = "none";
            dImg.style.display = "block"; 
            dImg.src = item.img;
            dTxt.innerHTML = item.word; 
            rBtn.style.display = "block";
            
            if (item.targetKey) {
                badge.style.display = "block";
                badge.textContent = `🎯 Target Sound: ${item.targetKey}`;
            } else {
                badge.style.display = "none";
            }
        }
        
        document.getElementById('counter').textContent = `ITEM ${currentIdx + 1} / ${assessmentList.length}`;
        document.getElementById('reviewPanel').style.display = 'none';
        
        // Restore prior label selection if already reviewed
        currentLabel = clinicianResults[currentIdx]?.soda || "NotLabeled";
        document.querySelectorAll('.review-panel .soda-btn').forEach(btn => {
            btn.classList.toggle('selected', btn.textContent.trim() === currentLabel);
        });
        currentBlob = null;
    }

    async function handleRecording() {
        if (!mediaRecorder || mediaRecorder.state === "inactive") {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false, sampleRate: 48000 } 
                });
                audioCtx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 48000 });
                streamSource = audioCtx.createMediaStreamSource(stream);
                biquadFilter = audioCtx.createBiquadFilter();
                biquadFilter.type = "highpass";
                biquadFilter.frequency.value = 80; 

                const dest = audioCtx.createMediaStreamDestination();
                streamSource.connect(biquadFilter).connect(dest);

                mediaRecorder = new MediaRecorder(dest.stream);
                chunks = [];
                mediaRecorder.ondataavailable = e => chunks.push(e.data);
                mediaRecorder.onstop = () => { 
                    currentBlob = new Blob(chunks, { type: 'audio/wav' }); 
                    document.getElementById('reviewPanel').style.display = 'block'; 
                };

                mediaRecorder.start();
                document.getElementById('recordBtn').classList.add('recording');
                document.getElementById('recordBtn').textContent = "⏹️ STOP RECORDING";
                document.getElementById('reviewPanel').style.display = 'none';
            } catch (err) { alert("Mic Access Error: " + err.message); }
        } else {
            mediaRecorder.stop();
            audioCtx.close();
            document.getElementById('recordBtn').classList.remove('recording');
            document.getElementById('recordBtn').textContent = "🎙️ RECORD SAMPLE";
        }
    }

    function setLabel(label, btnElement) { 
        currentLabel = label; 
        document.querySelectorAll('.review-panel .soda-btn').forEach(x => x.classList.remove('selected')); 
        btnElement.classList.add('selected');

        // Persist response into clinical session map
        const item = assessmentList[currentIdx];
        clinicianResults[currentIdx] = {
            itemNumber: currentIdx,
            word: item.rawWord || item.word.replace(/<[^>]*>/g, ''),
            targetKey: item.targetKey || '',
            soda: label,
            timestamp: new Date().toLocaleTimeString()
        };
    }
    
    function playCurrent() { 
        if (currentBlob) new Audio(URL.createObjectURL(currentBlob)).play(); 
    }

    function finalizeSave() {
        const name = document.getElementById('pName').value.replace(/\s+/g, '_');
        const age = document.getElementById('pAge').value || 'NA';
        const gender = document.getElementById('pGender').value;
        const date = new Date().toISOString().split('T')[0];
        const item = assessmentList[currentIdx];
        
        const cleanWord = item.rawWord || item.word.replace(/<[^>]*>/g, '');
        const cleanTarget = item.targetKey ? item.targetKey.replace(/[^a-zA-Z0-9\u0900-\u097F]/g, '_') : 'Sound';
        
        if (currentBlob) {
            const link = document.createElement('a');
            link.href = URL.createObjectURL(currentBlob);
            link.download = `${name}_${age}_${gender}_Word-${cleanWord}_Target-${cleanTarget}_${currentLabel}_${date}.wav`;
            link.click();
        }
        
        alert(`Evaluation recorded: ${currentLabel}`);
    }

    // Client-Side PDF Generation Function
    function generatePDFReport() {
        const name = document.getElementById('pName').value.trim() || "Unregistered Patient";
        const age = document.getElementById('pAge').value.trim() || "N/A";
        const gender = document.getElementById('pGender').value;
        const cr = document.getElementById('pCR').value.trim() || "N/A";
        const clinician = document.getElementById('pClinician').value.trim() || "N/A";
        const testDate = new Date().toLocaleDateString('en-IN', { year: 'numeric', month: 'short', day: 'numeric' });

        const { jsPDF } = window.jspdf;
        const doc = new jsPDF({ orientation: 'portrait', unit: 'mm', format: 'a4' });

        // Header Banner
        doc.setFillColor(2, 132, 199); // Primary Slate Blue
        doc.rect(0, 0, 210, 24, 'F');
        doc.setTextColor(255, 255, 255);
        doc.setFontSize(14);
        doc.setFont('helvetica', 'bold');
        doc.text("PGIMER SPEECH ARTICULATION ASSESSMENT REPORT", 105, 11, { align: 'center' });
        doc.setFontSize(9);
        doc.setFont('helvetica', 'normal');
        doc.text("Department of Otolaryngology | Clinical SODA Assessment Battery", 105, 18, { align: 'center' });

        // Demographic Summary Card
        doc.setFillColor(241, 245, 249);
        doc.roundedRect(14, 28, 182, 28, 3, 3, 'F');
        doc.setTextColor(15, 23, 42);
        doc.setFontSize(9);
        
        doc.setFont('helvetica', 'bold'); doc.text("Patient Name:", 18, 35);
        doc.setFont('helvetica', 'normal'); doc.text(name, 45, 35);
        doc.setFont('helvetica', 'bold'); doc.text("Age / Gender:", 18, 43);
        doc.setFont('helvetica', 'normal'); doc.text(`${age} / ${gender}`, 45, 43);
        doc.setFont('helvetica', 'bold'); doc.text("CR / ID:", 18, 51);
        doc.setFont('helvetica', 'normal'); doc.text(cr, 45, 51);

        doc.setFont('helvetica', 'bold'); doc.text("Date of Test:", 115, 35);
        doc.setFont('helvetica', 'normal'); doc.text(testDate, 145, 35);
        doc.setFont('helvetica', 'bold'); doc.text("Examiner:", 115, 43);
        doc.setFont('helvetica', 'normal'); doc.text(clinician, 145, 43);
        doc.setFont('helvetica', 'bold'); doc.text("Test Language:", 115, 51);
        doc.setFont('helvetica', 'normal'); doc.text("Hindi (Varnamala Sequence)", 145, 51);

        // Aggregate SODA Statistics
        let counts = { Normal: 0, Substitution: 0, Omission: 0, Distortion: 0, Addition: 0, NotTested: 0 };
        const rows = [];
        let seq = 1;

        assessmentList.forEach((item, idx) => {
            if (item.type === "header") {
                rows.push([{ content: `--- ${item.word} SECTION ---`, colSpan: 5, styles: { fillColor: [226, 232, 240], fontStyle: 'bold', halign: 'center' } }]);
            } else {
                const result = clinicianResults[idx];
                const verdict = result ? result.soda : "Not Evaluated";
                if (counts[verdict] !== undefined) counts[verdict]++;
                else counts.NotTested++;

                rows.push([
                    seq++,
                    item.rawWord || item.word.replace(/<[^>]*>/g, ''),
                    item.targetKey,
                    verdict,
                    result ? result.timestamp : '-'
                ]);
            }
        });

        // Summary Metric Mini-Table
        doc.autoTable({
            startY: 59,
            head: [['Evaluated Metric', 'Normal', 'Substitution (S)', 'Omission (O)', 'Distortion (D)', 'Addition (A)', 'Not Tested']],
            body: [[
                'Counts',
                counts.Normal,
                counts.Substitution,
                counts.Omission,
                counts.Distortion,
                counts.Addition,
                counts.NotTested
            ]],
            theme: 'grid',
            headStyles: { fillColor: [15, 23, 42], fontSize: 8, halign: 'center' },
            bodyStyles: { fontSize: 8, halign: 'center', fontStyle: 'bold' },
            margin: { left: 14, right: 14 }
        });

        // Detailed Stimuli Response Grid
        doc.autoTable({
            startY: doc.lastAutoTable.finalY + 5,
            head: [['#', 'Stimulus Word', 'Target Phoneme & Position', 'SODA Judgment', 'Time Recorded']],
            body: rows,
            theme: 'striped',
            headStyles: { fillColor: [2, 132, 199], fontSize: 8 },
            bodyStyles: { fontSize: 8 },
            columnStyles: {
                0: { cellWidth: 10, halign: 'center' },
                1: { cellWidth: 35 },
                2: { cellWidth: 60 },
                3: { cellWidth: 42, fontStyle: 'bold' },
                4: { cellWidth: 35, halign: 'center' }
            },
            didParseCell: function(data) {
                if (data.column.index === 3) {
                    if (data.cell.raw === 'Normal') data.cell.styles.textColor = [16, 185, 129];
                    else if (['Substitution', 'Omission', 'Distortion', 'Addition'].includes(data.cell.raw)) {
                        data.cell.styles.textColor = [220, 38, 38];
                    }
                }
            },
            margin: { left: 14, right: 14 }
        });

        // Footer / Signature Section
        const pageCount = doc.internal.getNumberOfPages();
        for (let i = 1; i <= pageCount; i++) {
            doc.setPage(i);
            doc.setFontSize(7);
            doc.setTextColor(148, 163, 184);
            doc.text(`Page ${i} of ${pageCount} | Generated via PGIMER Articulation Assessment Tool`, 105, 290, { align: 'center' });
        }

        // Trigger Direct PDF Download
        const cleanName = name.replace(/\s+/g, '_');
        doc.save(`Articulation_Report_${cleanName}_${testDate.replace(/\s+/g, '_')}.pdf`);
    }

    window.onload = updateUI;
</script>
