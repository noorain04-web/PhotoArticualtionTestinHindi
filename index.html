<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PGIMER Articulation Assessment - Devanagari SODA Report</title>
    <style>
        :root { 
            --primary: #0284c7; 
            --bg: #f8fafc; 
            --text: #0f172a; 
            --target-accent: #f59e0b;
            --highlight-color: #dc2626;
        }
        body { font-family: system-ui, -apple-system, "Noto Sans Devanagari", "Mangal", sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 10px; display: flex; flex-direction: column; align-items: center; }
        .container { width: 100%; max-width: 460px; background: #fff; padding: 20px; border-radius: 24px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); box-sizing: border-box; }
        
        .session-info { font-size: 0.75rem; color: #64748b; background: #f1f5f9; padding: 10px; border-radius: 12px; margin-bottom: 12px; width: 100%; text-align: center; border: 1px solid #e2e8f0; display: none; }
        
        .registration-box { background: #f1f5f9; padding: 15px; border-radius: 18px; margin-bottom: 15px; border: 2px solid var(--primary); }
        .meta-input { width: 100%; padding: 10px; margin: 5px 0; border: 1px solid #cbd5e1; border-radius: 8px; box-sizing: border-box; font-size: 0.95rem; }
        
        .stimulus-box { width: 100%; height: 290px; background: #f8fafc; border-radius: 18px; display: flex; flex-direction: column; align-items: center; justify-content: center; margin-bottom: 15px; border: 1px dashed #cbd5e1; overflow: hidden; position: relative; }
        .stimulus-image { max-width: 85%; max-height: 58%; object-fit: contain; }
        
        .target-word { font-size: 2.3rem; font-weight: 800; margin-top: 6px; color: var(--text); }
        .header-card { font-size: 2.4rem; font-weight: 900; color: #ef4444; }
        
        .highlight-target {
            color: var(--highlight-color) !important;
            font-weight: 900;
            text-decoration: underline;
            text-underline-offset: 4px;
        }
        
        .target-sound-badge {
            background: var(--target-accent);
            color: #fff;
            padding: 4px 14px;
            border-radius: 20px;
            font-size: 0.95rem;
            font-weight: 700;
            margin-bottom: 8px;
            display: none;
            box-shadow: 0 2px 8px rgba(245, 158, 11, 0.25);
        }
        
        .btn-record { background: #ef4444; color: white; width: 100%; padding: 13px; border-radius: 14px; border: none; font-weight: 700; cursor: pointer; font-size: 0.95rem; }
        .recording { background: #991b1b !important; animation: pulse 1.5s infinite; }
        .review-panel { background: #f0fdf4; border: 2px solid #10b981; padding: 15px; border-radius: 18px; display: none; margin-top: 15px; }
        .soda-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin: 10px 0; }
        .soda-btn { background: white; border: 1px solid #cbd5e1; padding: 9px; border-radius: 8px; font-size: 0.85rem; text-align: center; cursor: pointer; font-weight: 600; }
        .soda-btn.selected { background: var(--primary); color: white; border-color: var(--primary); }
        
        .btn-pdf { background: #0f172a; color: white; width: 100%; padding: 12px; border-radius: 14px; border: none; font-weight: 700; cursor: pointer; font-size: 0.9rem; margin-top: 12px; }
        
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.7; } }

        /* Print Specific Styling */
        @media print {
            body * { visibility: hidden; }
            #reportPrintArea, #reportPrintArea * { visibility: visible; }
            #reportPrintArea { position: absolute; left: 0; top: 0; width: 100%; }
        }
    </style>
</head>
<body>

<div class="container">
    <div id="sessionDisplay" class="session-info"></div>

    <div style="text-align:center; font-size:0.75rem; font-weight:bold; color:#64748b; margin-bottom:10px;" id="counter">ITEM 1 / 108</div>

    <div class="stimulus-box" id="mainDisplay">
        <div id="regForm" class="registration-box">
            <span style="font-size: 0.8rem; font-weight: 800; color: var(--primary);">PATIENT REGISTRATION</span>
            <input type="text" id="pName" class="meta-input" placeholder="Patient Name (Mandatory)">
            <div style="display:flex; gap:10px;">
                <input type="text" id="pAge" class="meta-input" placeholder="Age">
                <select id="pGender" class="meta-input">
                    <option value="Male">Male</option>
                    <option value="Female">Female</option>
                    <option value="Other">Other</option>
                </select>
            </div>
            <input type="text" id="pCR" class="meta-input" placeholder="CR / Patient ID (Optional)">
            <input type="text" id="pClinician" class="meta-input" placeholder="Clinician / Examiner Name">
        </div>
        
        <div id="targetSoundBadge" class="target-sound-badge"></div>
        <img id="displayImg" src="" class="stimulus-image" style="display:none;" alt="Stimulus">
        <div id="displayText" class="target-word"></div>
    </div>

    <div style="display:flex; gap:10px; width:100%; margin-bottom:12px;">
        <button class="soda-btn" style="flex:1" onclick="changeItem(-1)">PREV</button>
        <button class="soda-btn" style="flex:1" onclick="changeItem(1)">NEXT</button>
    </div>

    <button id="recordBtn" class="btn-record" style="display:none;" onclick="handleRecording()">🎙️ RECORD SAMPLE</button>

    <div id="reviewPanel" class="review-panel">
        <button class="soda-btn" style="width:100%; background:#0f172a; color:white; margin-bottom:10px;" onclick="playCurrent()">▶️ PREVIEW AUDIO</button>
        <div class="soda-grid">
            <div class="soda-btn" onclick="setLabel('Normal', this)">Normal</div>
            <div class="soda-btn" onclick="setLabel('Substitution', this)">Substitution</div>
            <div class="soda-btn" onclick="setLabel('Omission', this)">Omission</div>
            <div class="soda-btn" onclick="setLabel('Distortion', this)">Distortion</div>
            <div class="soda-btn" onclick="setLabel('Addition', this)">Addition</div>
        </div>
        <button class="btn-record" style="background:#10b981; margin:0;" onclick="finalizeSave()">💾 SAVE SAMPLE</button>
    </div>

    <button class="btn-pdf" onclick="generateDevanagariReport()">📄 GENERATE DEVANAGARI REPORT (PDF)</button>
</div>

<!-- Hidden Clean Report Print Area (supports complete Unicode Devanagari rendering) -->
<div id="reportPrintArea" style="display: none; font-family: system-ui, -apple-system, 'Noto Sans Devanagari', 'Mangal', sans-serif;"></div>

        { word: "कि<span class='highlight-target'>सा</span>न", rawHindi: "किसान", img: "kisan.jpg", targetKey: "स (Medial)" },
        { word: "समो<span class='highlight-target'>सा</span>", rawHindi: "समोसा", img: "samosa_02.jpg", targetKey: "स (Final)" },
        
        // /h/ (ह)
        { word: "<span class='highlight-target'>हा</span>थी", rawHindi: "हाथी", img: "haathi_02.jpg", targetKey: "ह (Initial)" },
        { word: "सिपा<span class='highlight-target'>ही</span>", rawHindi: "सिपाही", img: "sipahi.jpg", targetKey: "ह (Medial)" },
        
        { type: "header", word: "BLENDS" },
        // /ksh/ (क्ष)
        { word: "<span class='highlight-target'>क्ष</span>त्रिय", rawHindi: "क्षत्रिय", img: "kshatriya.jpg", targetKey: "क्ष (Conjunct Initial)" },
        { word: "रा<span class='highlight-target'>क्ष</span>स", rawHindi: "राक्षस", img: "rakshas.jpg", targetKey: "क्ष (Conjunct Medial)" },
        { word: "वृ<span class='highlight-target'>क्ष</span>", rawHindi: "वृक्ष", img: "vriksh.jpg", targetKey: "क्ष (Conjunct Final)" },
        
        // /tr/ (त्र)
        { word: "<span class='highlight-target'>त्रि</span>शूल", rawHindi: "त्रिशूल", img: "trishul.jpg", targetKey: "त्र (Cluster Initial)" },
        { word: "क्ष<span class='highlight-target'>त्रि</span>य", rawHindi: "क्षत्रिय", img: "kshatriya_02.jpg", targetKey: "त्र (Cluster Medial)" },
        { word: "प<span class='highlight-target'>त्र</span>", rawHindi: "पत्र", img: "patra.jpg", targetKey: "त्र (Cluster Final)" },
        
        // /gy/ (ज्ञ)
        { word: "य<span class='highlight-target'>ज्ञ</span>", rawHindi: "यज्ञ", img: "yagya.jpg", targetKey: "ज्ञ (Conjunct Final)" }
    ];

    let clinicianResults = {};
    let currentIdx = 0, mediaRecorder, chunks = [], currentBlob = null, currentLabel = "NotLabeled";
    let audioCtx, streamSource, biquadFilter;

    function checkMetadata() {
        const name = document.getElementById('pName').value.trim();
        const age = document.getElementById('pAge').value.trim();
        const gender = document.getElementById('pGender').value;
        const display = document.getElementById('sessionDisplay');

        if (name !== "") {
            display.style.display = "block";
            display.textContent = `ACTIVE SESSION: ${name} (${age || 'N/A'}, ${gender})`;
            return true;
        }
        return false;
    }

    function changeItem(step) {
        if (step > 0 && currentIdx === 0 && !checkMetadata()) {
            alert("Mandatory: Please enter Patient Name to begin.");
            return;
        }
        currentIdx = (currentIdx + step + assessmentList.length) % assessmentList.length;
        updateUI();
    }

    function updateUI() {
        const item = assessmentList[currentIdx];
        const dImg = document.getElementById('displayImg');
        const dTxt = document.getElementById('displayText');
        const rBtn = document.getElementById('recordBtn');
        const reg = document.getElementById('regForm');
        const badge = document.getElementById('targetSoundBadge');
        
        if (currentIdx === 0 || item.type === "header") {
            reg.style.display = currentIdx === 0 ? "block" : "none";
            dImg.style.display = "none";
            badge.style.display = "none";
            dTxt.innerHTML = `<span class="header-card">${item.word}</span>`;
            rBtn.style.display = "none";
        } else {
            reg.style.display = "none";
            dImg.style.display = "block"; 
            dImg.src = item.img;
            dTxt.innerHTML = item.word; 
            rBtn.style.display = "block";
            
            if (item.targetKey) {
                badge.style.display = "block";
                badge.textContent = `🎯 Target Sound: ${item.targetKey}`;
            } else {
                badge.style.display = "none";
            }
        }
        
        document.getElementById('counter').textContent = `ITEM ${currentIdx + 1} / ${assessmentList.length}`;
        document.getElementById('reviewPanel').style.display = 'none';
        
        currentLabel = clinicianResults[currentIdx]?.soda || "NotLabeled";
        document.querySelectorAll('.review-panel .soda-btn').forEach(btn => {
            btn.classList.toggle('selected', btn.textContent.trim() === currentLabel);
        });
        currentBlob = null;
    }

    async function handleRecording() {
        if (!mediaRecorder || mediaRecorder.state === "inactive") {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false, sampleRate: 48000 } 
                });
                audioCtx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 48000 });
                streamSource = audioCtx.createMediaStreamSource(stream);
                biquadFilter = audioCtx.createBiquadFilter();
                biquadFilter.type = "highpass";
                biquadFilter.frequency.value = 80; 

                const dest = audioCtx.createMediaStreamDestination();
                streamSource.connect(biquadFilter).connect(dest);

                mediaRecorder = new MediaRecorder(dest.stream);
                chunks = [];
                mediaRecorder.ondataavailable = e => chunks.push(e.data);
                mediaRecorder.onstop = () => { 
                    currentBlob = new Blob(chunks, { type: 'audio/wav' }); 
                    document.getElementById('reviewPanel').style.display = 'block'; 
                };

                mediaRecorder.start();
                document.getElementById('recordBtn').classList.add('recording');
                document.getElementById('recordBtn').textContent = "⏹️ STOP RECORDING";
                document.getElementById('reviewPanel').style.display = 'none';
            } catch (err) { alert("Mic Access Error: " + err.message); }
        } else {
            mediaRecorder.stop();
            audioCtx.close();
            document.getElementById('recordBtn').classList.remove('recording');
            document.getElementById('recordBtn').textContent = "🎙️ RECORD SAMPLE";
        }
    }

    function setLabel(label, btnElement) { 
        currentLabel = label; 
        document.querySelectorAll('.review-panel .soda-btn').forEach(x => x.classList.remove('selected')); 
        btnElement.classList.add('selected');

        const item = assessmentList[currentIdx];
        clinicianResults[currentIdx] = {
            itemNumber: currentIdx,
            wordHindi: item.rawHindi || item.word.replace(/<[^>]*>/g, ''),
            targetKey: item.targetKey || '',
            soda: label,
            timestamp: new Date().toLocaleTimeString()
        };
    }
    
    function playCurrent() { 
        if (currentBlob) new Audio(URL.createObjectURL(currentBlob)).play(); 
    }

    function finalizeSave() {
        const name = document.getElementById('pName').value.replace(/\s+/g, '_');
        const age = document.getElementById('pAge').value || 'NA';
        const gender = document.getElementById('pGender').value;
        const date = new Date().toISOString().split('T')[0];
        const item = assessmentList[currentIdx];
        
        const cleanWord = (item.rawHindi || item.word).replace(/[^a-zA-Z0-9\u0900-\u097F]/g, '_');
        const cleanTarget = (item.targetKey || 'Target').replace(/[^a-zA-Z0-9\u0900-\u097F]/g, '_');
        
        if (currentBlob) {
            const link = document.createElement('a');
            link.href = URL.createObjectURL(currentBlob);
            link.download = `${name}_${age}_${gender}_Item-${cleanWord}_Target-${cleanTarget}_${currentLabel}_${date}.wav`;
            link.click();
        }
        
        alert(`Evaluation saved: ${currentLabel}`);
    }

    // High-Fidelity Devanagari Native Vector Print/PDF Engine
    function generateDevanagariReport() {

        const cr = document.getElementById('pCR').value.trim() || "N/A";
        const clinician = document.getElementById('pClinician').value.trim() || "N/A";
        const testDate = new Date().toLocaleDateString('en-IN', { year: 'numeric', month: 'short', day: 'numeric' });

        let counts = { Normal: 0, Substitution: 0, Omission: 0, Distortion: 0, Addition: 0, NotTested: 0 };
        let rowsHtml = '';

        assessmentList.forEach((item, idx) => {
            if (item.type === "header") {
                rowsHtml += `
                    <tr style="background:#e2e8f0; font-weight:bold; text-align:center;">

                    </tr>`;

                const res = clinicianResults[idx];
                const verdict = res ? res.soda : "Not Evaluated";
                if (counts[verdict] !== undefined) counts[verdict]++;
                else counts.NotTested++;

                let verdictColor = '#475569';

                else if (['Substitution', 'Omission', 'Distortion', 'Addition'].includes(verdict)) verdictColor = '#dc2626';

                        <td style="padding:6px 8px; font-size:13px; font-weight:700; color:${verdictColor};">${verdict}</td>
                        <td style="padding:6px 8px; text-align:center; font-size:12px; color:#64748b;">${res ? res.timestamp : '-'}</td>

        reportArea.innerHTML = `

                    <p style="margin:4px 0 0 0; font-size:12px; opacity:0.95;">Standardized Hindi Articulation & Phonological Battery (SODA Analysis)</p>
                </div>

                <!-- Patient & Session Information -->
                <div style="background:#f8fafc; border:1px solid #e2e8f0; border-radius:10px; padding:12px 16px; margin-bottom:15px; display:grid; grid-template-columns: 1fr 1fr; gap:10px; font-size:13px;">
                    <div><strong>Patient Name (मरीज का नाम):</strong> ${name}</div>
                    <div><strong>Date of Test (दिनांक):</strong> ${testDate}</div>
                    <div><strong>Age / Gender (आयु / लिंग):</strong> ${age} / ${gender}</div>
                    <div><strong>Examiner (परीक्षक):</strong> ${clinician}</div>
                    <div><strong>CR / Patient ID:</strong> ${cr}</div>
                    <div><strong>Test Battery:</strong> Hindi Varnamala (I-M-F Order)</div>
                </div>

                <!-- Metric Summary Box -->
                <table style="width:100%; border-collapse:collapse; margin-bottom:15px; font-size:12px; text-align:center;">
                    <thead>
                        <tr style="background:#0f172a; color:white;">
                            <th style="padding:6px; border:1px solid #cbd5e1;">Evaluated Metric</th>
                            <th style="padding:6px; border:1px solid #cbd5e1;">Normal</th>
                            <th style="padding:6px; border:1px solid #cbd5e1;">Substitution (S)</th>
                            <th style="padding:6px; border:1px solid #cbd5e1;">Omission (O)</th>
                            <th style="padding:6px; border:1px solid #cbd5e1;">Distortion (D)</th>
                            <th style="padding:6px; border:1px solid #cbd5e1;">Addition (A)</th>
                            <th style="padding:6px; border:1px solid #cbd5e1;">Not Evaluated</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr style="background:#f1f5f9; font-weight:bold;">
                            <td style="padding:6px; border:1px solid #cbd5e1;">Total Counts</td>
                            <td style="padding:6px; border:1px solid #cbd5e1; color:#16a34a;">${counts.Normal}</td>
                            <td style="padding:6px; border:1px solid #cbd5e1; color:#dc2626;">${counts.Substitution}</td>
                            <td style="padding:6px; border:1px solid #cbd5e1; color:#dc2626;">${counts.Omission}</td>
                            <td style="padding:6px; border:1px solid #cbd5e1; color:#dc2626;">${counts.Distortion}</td>
                            <td style="padding:6px; border:1px solid #cbd5e1; color:#dc2626;">${counts.Addition}</td>
                            <td style="padding:6px; border:1px solid #cbd5e1; color:#64748b;">${counts.NotTested}</td>
                        </tr>
                    </tbody>
                </table>

                <!-- Main Assessment Data Table in Devanagari -->
                <table style="width:100%; border-collapse:collapse; text-align:left;">
                    <thead>
                        <tr style="background:#0284c7; color:white; font-size:13px;">
                            <th style="padding:8px; width:6%; text-align:center;">#</th>
                            <th style="padding:8px; width:28%;">Stimulus Word (शब्द)</th>

                            <th style="padding:8px; width:18%;">SODA Judgment</th>

                        ${rowsHtml}

                <div style="margin-top:20px; font-size:11px; text-align:center; color:#94a3b8; border-top:1px solid #e2e8f0; padding-top:8px;">
                    Generated via PGIMER Articulation Assessment Clinical Diagnostic Tool

        `;

        // Render clean print frame without page break glitches
        const printWindow = window.open('', '_blank');

            <html>
                <head>
                    <title>Articulation_Report_${name.replace(/\s+/g, '_')}_${testDate}</title>

                        body { margin: 0; padding: 10px; font-family: system-ui, -apple-system, "Noto Sans Devanagari", "Mangal", sans-serif; }

        printWindow.document.close();
        printWindow.focus();
        setTimeout(() => {
            printWindow.print();
        }, 350);
    }

    window.onload = updateUI;
</script>
